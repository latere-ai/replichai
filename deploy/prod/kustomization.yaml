apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production: the `latere` namespace, and the values that are production's own
# — its public host, the OIDC client registered for that host, and who is a
# platform admin before anyone has an account to promote them from. The base
# carries only what every environment shares. The release pipeline
# (.github/workflows/release.yml) applies this on every v* tag; by hand:
#   kubectl apply -k deploy/prod/
namespace: latere

resources:
  - ../base

patches:
  - target:
      kind: Deployment
      name: replichai
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: replichai
      spec:
        template:
          spec:
            containers:
              - name: replichai
                env:
                  # Every link in an outbound message is built from this.
                  - name: BASE_URL
                    value: https://replichai.latere.ai
                  # The OIDC client registered with auth.latere.ai for this
                  # host: a public PKCE client, so there is no client secret.
                  - name: AUTH_CLIENT_ID
                    value: replichai
                  - name: AUTH_REDIRECT_URL
                    value: https://replichai.latere.ai/callback
                  # Who is an admin — a policy, not a secret, so it lives here,
                  # version-controlled and reviewable, not in the .env secret.
                  # Runtime changes go through an admin via /admin/access.
                  #
                  # Anyone who signs in is granted `user`; credits are what
                  # limit them, and a new account has none. This list is only
                  # how the first platform admin exists before anyone has an
                  # account to promote them from.
                  - name: ADMIN_EMAILS
                    value: hi@changkun.de
  - target:
      kind: Ingress
      name: replichai
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: replichai
      spec:
        tls:
          - hosts:
              - replichai.latere.ai
            secretName: latere-replichai-tls
        rules:
          - host: replichai.latere.ai
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: replichai
                      port:
                        number: 80

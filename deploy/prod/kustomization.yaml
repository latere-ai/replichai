apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay. The base already carries the prod host
# (replichai.latere.ai), BASE_URL, and TLS secret, so prod only places
# everything in the `latere` namespace. Deploy with:
#   kubectl apply -k deploy/prod/
namespace: latere

resources:
  - ../base

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production: the `latere` namespace and the values specific to production,
# namely its public host, the OIDC client registered for that host, and the
# platform admins seeded before anyone has an account to promote them from. The
# base carries only what every environment shares. The release pipeline in
# .github/workflows/release.yml applies this on every v* tag. By hand:
#   kubectl apply -k deploy/prod/
namespace: latere

resources:
  - ../base

# The release production runs. `lateregate release` rewrites this tag in the
# commit it tags, so the release pipeline's apply and its `set image` name the
# same build, and an apply by hand never rolls production to another one.
images:
  - name: ghcr.io/latere-ai/replichai
    newTag: v0.30.3

patches:
  - target:
      kind: Deployment
      name: replichai
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: replichai
      spec:
        template:
          spec:
            containers:
              - name: replichai
                env:
                  # Every link in an outbound message is built from this.
                  - name: BASE_URL
                    value: https://replichai.latere.ai
                  # The OIDC client registered with auth.latere.ai for this
                  # host: a public PKCE client, so there is no client secret.
                  - name: AUTH_CLIENT_ID
                    value: replichai
                  - name: AUTH_REDIRECT_URL
                    value: https://replichai.latere.ai/callback
                  # The runtimes a person may choose when they start a
                  # session, beside the base's REPLICHAI_RUNTIME. A latere
                  # session runs as the person who started it and their own
                  # Latere wallet pays. REPLICHAI_SIGNIN_KEY, which seals the
                  # sign-in it keeps for them, comes from replichai-config;
                  # without it the server refuses to start.
                  - name: REPLICHAI_RUNTIMES
                    value: latere
                  # The admin list is policy, not a secret, so it lives here,
                  # version-controlled and reviewable, rather than in the .env
                  # secret. Runtime changes go through an admin via
                  # /admin/access.
                  #
                  # Anyone who signs in is granted `user`. Credits limit what
                  # they can do, and a new account has none. This list only
                  # seeds the first platform admin before anyone has an account
                  # to promote them from.
                  - name: ADMIN_EMAILS
                    value: hi@changkun.de
  - target:
      kind: Ingress
      name: replichai
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: replichai
      spec:
        tls:
          - hosts:
              - replichai.latere.ai
            secretName: latere-replichai-tls
        rules:
          - host: replichai.latere.ai
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: replichai
                      port:
                        number: 80

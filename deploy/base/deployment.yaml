apiVersion: apps/v1
kind: Deployment
metadata:
  name: replichai
  labels:
    app: replichai
spec:
  # Two replicas for availability: with a single pod every deploy, node drain
  # or crash is downtime. All state is in Postgres and the concurrency-critical
  # paths are built for it. Claim uses SELECT ... FOR UPDATE SKIP LOCKED so two
  # workers never take the same job, the enqueue/credit gate and settlement are
  # advisory-locked and exactly-once, the Stripe webhook is idempotent, and
  # cancel and the live stream carry no pod-local state. Auth is a stateless
  # cookie, so no session affinity is needed. The PodDisruptionBudget beside
  # this keeps at least one pod through a voluntary disruption.
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: replichai
  template:
    metadata:
      labels:
        app: replichai
    spec:
      # The image already runs as a numeric non-root user. runAsNonRoot makes
      # the cluster refuse the pod if that changes, and the container settings
      # below deny the process any privilege escalation.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: replichai
          image: ghcr.io/latere-ai/replichai:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          # replichai-config is created from the deployment's .env and holds
          # credentials only: ANTHROPIC_API_KEY, the GitHub App id and key or
          # the REPLICHAI_GITHUB_TOKEN fallback, AUTH_COOKIE_KEY,
          # AUTH_CLIENT_SECRET where the client has one, MAILGUN_API_KEY,
          # DRAFT_API_KEY, and the Stripe keys. A key in the secret that a
          # manifest also sets with `env` is ignored, because Kubernetes gives
          # `env` precedence over `envFrom`. See deploy/README.md.
          envFrom:
            - secretRef:
                name: replichai-config
          # Values shared by every environment live here. Values that differ,
          # namely BASE_URL, the OIDC client id and redirect URL, and the
          # bootstrap admin list, are patched in by each overlay in deploy/prod
          # and deploy/staging, so staging cannot inherit production's client
          # or admins by omission.
          env:
            # DATABASE_URL comes from the terraform-owned db secret, not .env, so
            # the app and the cluster agree on one connection string.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: replichai-db
                  key: DATABASE_URL
            # The pooler's endpoint, which serving traffic opens. Migrations
            # keep DATABASE_URL: the pool is a fixed claim sized for request
            # traffic, and a boot-time migration on it would queue behind
            # serving work. Optional, so a cluster whose Secret predates the
            # pool still starts.
            - name: DATABASE_POOL_URL
              valueFrom:
                secretKeyRef:
                  name: replichai-db
                  key: DATABASE_POOL_URL
                  optional: true
            - name: ADDR
              value: ":8080"
            # Real audits run on the Anthropic managed runtime. memory is dev only.
            - name: REPLICHAI_RUNTIME
              value: anthropic-managed
            # DEV is deliberately unset: the gate is fail-closed and every
            # request must carry a real OIDC session. Setting DEV would admit a
            # synthetic principal on a public domain.
            #
            # One issuer for every environment; each overlay registers its own
            # client with it. The cookie key is a credential and comes from the
            # replichai-config secret.
            - name: AUTH_ISSUER
              value: https://auth.latere.ai
            # The one audience the bearer path accepts: the actor token the
            # CLI mints for this server. A token minted for another service,
            # or for the issuer itself, is refused.
            - name: AUTH_AUDIENCE
              value: replichai.latere.ai
            # Outbound mail (006p): the project invitation. The sending domain
            # and region are policy and live here; MAILGUN_API_KEY is a
            # credential and comes from the replichai-config secret. With no key
            # in that secret the server logs invitations instead of sending
            # them, so they appear in the pod log and an invite never fails.
            - name: MAILGUN_DOMAIN
              value: mg.latere.ai
            - name: MAILGUN_REGION
              value: eu
            # No OTEL_EXPORTER_OTLP_ENDPOINT here on purpose. The Dash0 operator
            # injects it, pointing at the node-local collector, and skips any
            # container that already sets it, emitting only a Warning event. A
            # value here would leave this service exporting to the retired
            # collector while the namespace looked migrated.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5

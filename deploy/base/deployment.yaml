apiVersion: apps/v1
kind: Deployment
metadata:
  name: replichai
  labels:
    app: replichai
spec:
  # Two replicas for availability: a single pod makes every deploy, node drain,
  # or crash a moment of downtime. All state is in Postgres and the concurrency-
  # critical paths are built for it — Claim uses SELECT ... FOR UPDATE SKIP
  # LOCKED so two workers never take the same job, the enqueue/credit gate and
  # settlement are advisory-locked and exactly-once, the Stripe webhook is
  # idempotent, and cancel/live-stream carry no pod-local state (auth is a
  # stateless cookie, so no session affinity is needed). The PodDisruptionBudget
  # beside this keeps at least one pod through a voluntary disruption.
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: replichai
  template:
    metadata:
      labels:
        app: replichai
    spec:
      # The image already runs as a numeric non-root user; the cluster is told
      # to refuse it if that ever changes, and the process gets no route to
      # more privilege than it started with.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: replichai
          image: ghcr.io/latere-ai/replichai:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          # replichai-config is created from the deployment's .env and holds
          # credentials only: ANTHROPIC_API_KEY, the GitHub App id and key (or
          # the REPLICHAI_GITHUB_TOKEN fallback), AUTH_COOKIE_KEY,
          # AUTH_CLIENT_SECRET where the client has one, MAILGUN_API_KEY,
          # DRAFT_API_KEY, and the Stripe keys. A key in the secret that a
          # manifest also sets with `env` is dead: Kubernetes gives `env` the
          # last word over `envFrom`. See deploy/README.md.
          envFrom:
            - secretRef:
                name: replichai-config
          # What is the same in every environment lives here. What differs —
          # BASE_URL, the OIDC client id and redirect URL, and the bootstrap
          # admin list — is patched in by each overlay (deploy/prod,
          # deploy/staging), so staging can never inherit production's client
          # or admins by omission.
          env:
            # DATABASE_URL comes from the terraform-owned db secret, not .env, so
            # the app and the cluster agree on one connection string.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: replichai-db
                  key: DATABASE_URL
            - name: ADDR
              value: ":8080"
            # Real audits run on the Anthropic managed runtime (memory is dev only).
            - name: REPLICHAI_RUNTIME
              value: anthropic-managed
            # DEV is deliberately unset: the gate is fail-closed and every
            # request must carry a real OIDC session. Setting DEV would admit a
            # synthetic principal on a public domain.
            #
            # One issuer for every environment; each overlay registers its own
            # client with it. The cookie key is a credential and comes from the
            # replichai-config secret.
            - name: AUTH_ISSUER
              value: https://auth.latere.ai
            # Outbound mail (006p): the project invitation. The sending domain
            # and region are policy and live here; MAILGUN_API_KEY is a
            # credential and comes from the replichai-config secret. With no key
            # in that secret the server logs invitations instead of sending them
            # — visible in the pod log, and never a failed invite.
            - name: MAILGUN_DOMAIN
              value: mg.latere.ai
            - name: MAILGUN_REGION
              value: eu
            # No OTEL_EXPORTER_OTLP_ENDPOINT here on purpose. The Dash0 operator
            # injects it, pointing at the node-local collector, and skips any
            # container that already sets it, emitting only a Warning event. A
            # value here would leave this service exporting to the retired
            # collector while the namespace looked migrated.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5

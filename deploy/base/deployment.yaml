apiVersion: apps/v1
kind: Deployment
metadata:
  name: replichai
  labels:
    app: replichai
spec:
  # Two replicas for availability: a single pod makes every deploy, node drain,
  # or crash a moment of downtime. All state is in Postgres and the concurrency-
  # critical paths are built for it — Claim uses SELECT ... FOR UPDATE SKIP
  # LOCKED so two workers never take the same job, the enqueue/credit gate and
  # settlement are advisory-locked and exactly-once, the Stripe webhook is
  # idempotent, and cancel/live-stream carry no pod-local state (auth is a
  # stateless cookie, so no session affinity is needed). The PodDisruptionBudget
  # beside this keeps at least one pod through a voluntary disruption.
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: replichai
  template:
    metadata:
      labels:
        app: replichai
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: replichai
          image: ghcr.io/latere-ai/replichai:latest
          ports:
            - containerPort: 8080
          # replichai-config is created from the deployment's .env (secrets: the
          # OIDC client, REPLICHAI_API_KEY, REPLICHAI_GITHUB_TOKEN,
          # AUTH_COOKIE_KEY, ADMIN_EMAILS). See deploy/README.md.
          envFrom:
            - secretRef:
                name: replichai-config
          env:
            # DATABASE_URL comes from the terraform-owned db secret, not .env, so
            # the app and the cluster agree on one connection string.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: replichai-db
                  key: DATABASE_URL
            - name: ADDR
              value: ":8080"
            - name: BASE_URL
              value: https://replichai.latere.ai
            # Real audits run on the managed-agents backend (memory is dev only).
            - name: PROVIDER
              value: anthropic
            # DEV is deliberately unset in production: the gate is fail-closed and
            # every request must carry a real OIDC session. Setting DEV would
            # admit a synthetic principal on a public domain.
            #
            # OIDC login against latere auth (public PKCE client; the cookie key
            # and any API keys live in the replichai-config secret).
            - name: AUTH_ISSUER
              value: https://auth.latere.ai
            - name: AUTH_CLIENT_ID
              value: replichai
            - name: AUTH_REDIRECT_URL
              value: https://replichai.latere.ai/callback
            # Who is an admin — a policy, not a secret, so it lives in the
            # manifest (version-controlled and reviewable), not the .env secret.
            # Runtime changes go through an admin via /admin/access.
            #
            # Anyone who signs in is granted `user`; credits are what limit
            # them, and a new account has none. This list is only how the first
            # platform admin exists before anyone has an account to promote
            # them from.
            - name: ADMIN_EMAILS
              value: hi@changkun.de
            # Outbound mail (006p): the project invitation. The sending domain
            # and region are policy and live here; MAILGUN_API_KEY is a
            # credential and comes from the replichai-config secret. With no key
            # in that secret the server logs invitations instead of sending them
            # — visible in the pod log, and never a failed invite.
            - name: MAILGUN_DOMAIN
              value: mg.latere.ai
            - name: MAILGUN_REGION
              value: eu
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4318
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: replichai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # SSE and long audits: turn off response buffering so /jobs/{id}/events
    # streams live, and give the connection an hour so a run's stream is not cut.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  # No host and no TLS secret here: they identify an environment, so each
  # overlay's patch supplies its own `tls` and `rules`.

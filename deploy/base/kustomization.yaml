apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What every environment shares. The overlays in deploy/prod and deploy/staging
# add the namespace and the values specific to them.
# The image tag is intentionally not pinned here. The release pipeline in
# .github/workflows/release.yml builds ghcr.io/latere-ai/replichai:<tag> from
# the pushed tag and sets it on the Deployment after applying the overlay. The
# :latest placeholder in deployment.yaml is only a default, so a manual apply
# is followed by `kubectl -n latere set image deploy/replichai replichai=...`.
resources:
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml

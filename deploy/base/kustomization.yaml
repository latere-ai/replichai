apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What every environment shares. Overlays add the namespace and the values that
# are theirs alone (deploy/prod, deploy/staging).
# The image tag is intentionally NOT pinned here: the release pipeline
# (.github/workflows/release.yml) builds ghcr.io/latere-ai/replichai:<tag> from
# the pushed tag and sets it on the Deployment after applying the overlay. The
# :latest placeholder in deployment.yaml is only a default, so by hand an apply
# is followed by `kubectl -n latere set image deploy/replichai replichai=...`.
resources:
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml

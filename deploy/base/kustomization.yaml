apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-neutral base for the replichai web app. Overlays inject the
# namespace and patch env-specific values (public host, BASE_URL, TLS secret).
# The image tag is intentionally NOT pinned here — build and push
# ghcr.io/latere-ai/replichai:<tag> and either `kustomize edit set image` in the
# overlay or `kubectl -n latere set image deploy/replichai replichai=...`. The
# :latest placeholder in deployment.yaml is only a default.
resources:
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What every environment shares. The overlays in deploy/prod and deploy/staging
# add the namespace and the values specific to them.
# The image tag is intentionally not pinned here. deployment.yaml names the
# placeholder tag `unreleased`, which is never pushed, and each overlay that
# deploys pins the release it runs with an `images` entry.
resources:
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml

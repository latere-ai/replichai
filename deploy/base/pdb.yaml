apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: replichai
  labels:
    app: replichai
spec:
  # Keep at least one pod serving through a voluntary disruption such as a node
  # drain or a cluster upgrade. With replicas: 2 this evicts one pod at a time
  # rather than both at once. It constrains only the eviction API, not crashes
  # or the rolling deploy; the Deployment's maxUnavailable: 0 covers the deploy.
  minAvailable: 1
  selector:
    matchLabels:
      app: replichai

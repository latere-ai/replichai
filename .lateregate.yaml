# The gate configuration for replichai.
#
# The shared pipeline runs every gate that stands on its own. The `e2e`,
# `frontend` and `image` sections below declare what needs more than the plain
# test run: a live Postgres, a Bun package driving a browser, and the image.

hermetic:
  # The system directories only. The suite reaches two binaries: git, for the
  # publish and forge paths, and echo, which the local runtime uses as a
  # stand-in command. Anything else a test needs has to be added here, so a new
  # dependency is a deliberate decision.
  allow: [/usr/bin, /bin]

# There is no cover section and deliberately no `cover` target. The shared
# pipeline probes for that name and would run it on a runner with no database,
# where every PG store contract skips and internal/access alone loses about
# forty points, which makes the total meaningless. The real target is
# `cover-pg`, which needs docker compose and stays local.

# The spec tree carries YAML frontmatter, so spec-lint reads it.
#
# There is no index line. specs/README.md lists every spec, but its Status
# column is prose on purpose, for example "built (all six leaves)" or
# "implemented; its Python half deleted", and the table's preamble says the
# column names which part is missing. CheckIndex compares that cell to the enum
# verbatim, so many rows would fail on wording rather than on drift.
# README.md is excluded instead: with no index configured, spec-lint would
# otherwise try to parse it as a spec.
spec:
  # `superseded` is the terminal status: the work moved to the spec that
  # replaced it. `built` and `implemented` are shipped specs kept at the root,
  # because this tree's table is the record and a reader needs them there.
  status: [draft, designed, implemented, built, deferred, superseded]
  exclude: [BACKLOG.md, README.md]
  archive:
    dir: .archive
    statuses: [superseded]

golangci:
  extra:
    linters:
      enable:
        - bodyclose        # an unclosed response body leaks a connection
        - errorlint        # %w and errors.Is/As used correctly across wrapping
        - copyloopvar
        - durationcheck
        - nilerr           # returning nil after a non-nil error
        - rowserrcheck
        - sqlclosecheck
        - noctx            # HTTP requests without a context cannot be cancelled
        - contextcheck
        - errchkjson
        - gosec
        - revive
        - misspell
        - unconvert
        - unparam
        - wastedassign
        - prealloc
        - godot            # comments end in a period; they are prose here
        - nolintlint       # every //nolint must be specific and explained
      settings:
        errcheck:
          # Best-effort cleanup is deliberate and documented at each call site.
          exclude-functions:
            - (*os.File).Close
            - (io.Closer).Close
            # A failed write to stdout or stderr is not actionable: there is
            # nowhere left to report it.
            - fmt.Fprint
            - fmt.Fprintf
            - fmt.Fprintln
        revive:
          rules:
            - name: exported
              arguments: ["checkPrivateReceivers"]
            - name: package-comments
            - name: error-strings
            - name: error-naming
            - name: context-as-argument
            - name: indent-error-flow
            - name: var-naming
            - name: unreachable-code
        gosec:
          excludes:
            # A reproduction repository is meant to be read, committed, and
            # browsed, so 0755 directories and 0644 files are correct here;
            # G301/G306 assume a secrets-handling default that does not apply.
            - G301
            - G306
        misspell:
          # Everything is written in American English (CONTRIBUTING.md), and
          # the US locale enforces it. Four British forms are accepted because
          # changing them would change stored data: `cancelled` (and `cancelling`
          # beside it) is a terminal reason written into job rows and published
          # manifests, and
          # `authorised` and `organisation` sit in database migrations that
          # have already been applied and are never edited.
          locale: US
          ignore-rules:
            - authorised
            - cancelled
            - cancelling
            - organisation
      exclusions:
        rules:
          # Tests exercise error paths deliberately and read fixture files by
          # constructed path; neither is a finding there. They also marshal literals
          # they wrote a line earlier, where a checked error is noise, and build
          # small fixture slices where a preallocation says nothing.
          - path: _test\.go
            linters:
              - gosec
              - errcheck
              - unparam
              - noctx
              - errchkjson
              - prealloc

license:
  spdx: AGPL-3.0-or-later
  holder: Latere AI
  # The frontend is part of the same work and carries the same terms.
  extensions: ['.go', '.ts', '.tsx', '.mjs', '.sh']
  # The build and the compose entry point are part of the work too, and have
  # no extension to match on.
  names: [Makefile, Dockerfile]
  skip:
    # The built bundle, generated from frontend/src on every build.
    - dist

# Gates this repository does not run yet. Each entry expires: after the date
# the gate runs and fails on its own terms.
waive:
  cover:
    reason: >-
      twenty packages sit under the 90% floor, from cmd/server (29.2%) and
      internal/access (41.1%) to the runtimes at 83% to 89.6%; the per-file
      lint job was also off here, and this tree has not held the shared floor
      before. Closing it is test work in access, job and project first
    until: 2026-11-30

# The files that name the release. `lateregate release` moves the vX.Y.Z in
# each match to the tag it cuts, in the same commit as the changelog, so the
# production overlay never lags the tag. internal/doccheck holds the overlay
# to the changelog's newest section.
release:
  stamp:
    - file: deploy/prod/kustomization.yaml
      pattern: 'newTag: v\d+\.\d+\.\d+'

# The identity shape every Latere service shares, checked by the identity gate.
identity:
  role: service
  audience: replichai.latere.ai
  roles_only: true

# The database shape every Latere service shares: a pooled endpoint for serving,
# the direct one for migrations.
postgres:
  # Serving traffic opens the pooled endpoint and falls back to the direct one;
  # migrations keep the direct endpoint.
  role: pooled

# The Bun package that holds the web app. The gate installs it from its
# lockfile, then typechecks, runs the unit tests, builds the bundle the server
# embeds, and runs the package's `e2e` script, the browser suite.
frontend:
  projects: [frontend]
  # The browser suite drives Chromium through puppeteer-core. Naming the
  # package here has the shared pipeline install a browser before the gate.
  browser: [frontend]

# The image the release ships. The gate builds the Dockerfile and checks the
# binary reports the version it was built as, the image stays under its size
# cap, and it holds no shell.
image:
  images:
    - name: replichai
      build_args:
        VERSION: v0.0.0-candidate
      version_args: [-version]
      version_expect: "replichai v0.0.0-candidate"
      max_mib: 80
      # The server creates its working directory under /tmp when it starts, and
      # the gate starts the image with a read-only root file system and no
      # writable /tmp, where the cluster mounts one. It stops at start with a
      # read-only file system error, so no probe could answer.
      skip_start: the server writes its run directory under /tmp at start, which the gate's read-only start gives it no volume for

# Suites that run against real services. The plain test run has no database,
# so every Postgres store contract skips there; a skipped test fails an e2e
# suite, which keeps those contracts from silently not running.
e2e:
  - name: postgres
    why: >-
      the Postgres stores keep the contract the memory stores keep: access,
      credit, jobs, platform, profiles, projects and sign-ins, including the
      concurrent migrations and the pooled endpoint, under the race detector
    test:
      # The packages whose tests read TEST_DATABASE_URL.
      packages:
        - ./internal/access
        - ./internal/credit
        - ./internal/job
        - ./internal/platform
        - ./internal/profile
        - ./internal/project
        - ./internal/signin
      race: true
    services: [postgres]
    env:
      TEST_DATABASE_URL: "${postgres.url}"

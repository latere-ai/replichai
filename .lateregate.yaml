# The gate configuration for replichai.
#
# This repository calls the shared go-verify pipeline for the Go gates that
# stand on their own, and keeps jobs of its own for the two that do not: the
# race suite against a live Postgres, and the bun/Chrome frontend.

hermetic:
  # The system directories, and nothing else. The suite reaches two binaries:
  # git, for the publish and forge paths, and echo, which the local runtime
  # uses as a stand-in command. Naming them is the point -- anything a test
  # needs beyond these has to be added here, which is a decision rather than
  # an accident.
  allow: [/usr/bin, /bin]

modernize:
  # Off for the reasons recorded in .golangci.yml.
  disable: [newexpr, errorsastype]

# No cover section, and deliberately no `cover` target: the shared pipeline
# probes for that name and would run it on a runner with no database, where
# every PG store contract skips and internal/access alone loses about forty
# points -- a number this repo's own Makefile calls meaningless. The real one
# is `cover-pg`, which needs docker compose and stays local.

# The spec tree carries YAML frontmatter, so spec-lint reads it.
#
# No index line. specs/README.md lists every spec, but its Status column is
# prose on purpose -- "built (all six leaves)", "implemented; its Python half
# deleted" -- and the table's own preamble says the column names which part is
# missing. CheckIndex compares that cell to the enum verbatim, so 23 of 114
# rows would fail on wording rather than on drift. README.md is therefore
# excluded here instead: with no index configured, spec-lint would otherwise
# try to parse the index itself as a spec.
spec:
  dir: specs
  status: [draft, designed, implemented, built, deferred, superseded]
  require: [title, status]
  exclude: [BACKLOG.md, README.md]

golangci:
  extra:
    linters:
      enable:
        - bodyclose        # an unclosed response body leaks a connection
        - errorlint        # %w and errors.Is/As used correctly across wrapping
        - copyloopvar
        - durationcheck
        - nilerr           # returning nil after a non-nil error
        - rowserrcheck
        - sqlclosecheck
        - noctx            # HTTP requests without a context cannot be cancelled
        - contextcheck
        - errchkjson
        - gosec
        - revive
        - misspell
        - unconvert
        - unparam
        - wastedassign
        - prealloc
        - godot            # comments end in a period; they are prose here
        - nolintlint       # every //nolint must be specific and explained
      settings:
        errcheck:
          # Best-effort cleanup is deliberate and documented at each call site.
          exclude-functions:
            - (*os.File).Close
            - (io.Closer).Close
            # A failed write to stdout or stderr is not actionable: there is
            # nowhere left to report it.
            - fmt.Fprint
            - fmt.Fprintf
            - fmt.Fprintln
        revive:
          rules:
            - name: exported
              arguments: ["checkPrivateReceivers"]
            - name: package-comments
            - name: error-strings
            - name: error-naming
            - name: context-as-argument
            - name: indent-error-flow
            - name: var-naming
            - name: unreachable-code
        gosec:
          excludes:
            # A reproduction repository is meant to be read, committed, and
            # browsed, so 0755 directories and 0644 files are correct here;
            # G301/G306 assume a secrets-handling default that does not apply.
            - G301
            - G306
        misspell:
          # US spelling: "artifact" is the domain term used by the research
          # community, the backend API, and this project's own documents. It is
          # the only word we hold to US spelling, so the locale stays US and the
          # British forms this project writes everywhere else are listed below.
          locale: US
          # Prose here is British English on purpose. These are spellings, not
          # mistakes; `artefact` is deliberately absent so the one word that must
          # stay American keeps being enforced.
          ignore-rules:
            - analyse
            - analyses
            - authorised
            - authorises
            - behaviour
            - behavioural
            - behaviours
            - cancelled
            - cancelling
            - catalogue
            - catalogues
            - centre
            - centred
            - favour
            - favours
            - honour
            - honoured
            - honouring
            - honours
            - initialise
            - initialised
            - initialises
            - labelled
            - labelling
            - licence
            - licences
            - marshalling
            - materialise
            - materialised
            - materialises
            - organisation
            - organise
            - organised
            - organises
            - recognisable
            - recognise
            - recognised
            - recognises
            - reorganises
            - reorganising
            - serialise
            - serialised
            - serialises
            - summarise
            - summarised
            - summarises
            - summarising
            - synthesised
            - synthesises
            - travelled
            - tunnelled
            - unrecognised
      exclusions:
        rules:
          # Tests exercise error paths deliberately and read fixture files by
          # constructed path; neither is a finding there. They also marshal literals
          # they wrote a line earlier, where a checked error is noise, and build
          # small fixture slices where a preallocation says nothing.
          - path: _test\.go
            linters:
              - gosec
              - errcheck
              - unparam
              - noctx
              - errchkjson
              - prealloc

license:
  spdx: AGPL-3.0-or-later
  holder: Latere AI
  # The frontend is part of the same work and carries the same terms.
  extensions: ['.go', '.ts', '.tsx', '.mjs', '.sh']
  # The build and the compose entry point are part of the work too, and have
  # no extension to match on.
  names: [Makefile, Dockerfile]
  skip:
    # The built bundle, generated from frontend/src on every build.
    - dist

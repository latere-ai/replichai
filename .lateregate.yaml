# The gate configuration for replichai.
#
# This repository calls the shared go-verify pipeline for the Go gates that
# stand on their own, and keeps jobs of its own for the two that do not: the
# race suite against a live Postgres, and the bun/Chrome frontend.

hermetic:
  # The system directories, and nothing else. The suite reaches two binaries:
  # git, for the publish and forge paths, and echo, which the local runtime
  # uses as a stand-in command. Naming them is the point -- anything a test
  # needs beyond these has to be added here, which is a decision rather than
  # an accident.
  allow: [/usr/bin, /bin]

modernize:
  # Off for the reasons recorded in .golangci.yml.
  disable: [newexpr, errorsastype]

# No cover section, and deliberately no `cover` target: the shared pipeline
# probes for that name and would run it on a runner with no database, where
# every PG store contract skips and internal/access alone loses about forty
# points -- a number this repo's own Makefile calls meaningless. The real one
# is `cover-pg`, which needs docker compose and stays local.

# The spec tree carries YAML frontmatter, so spec-lint reads it.
#
# No index line. specs/README.md lists every spec, but its Status column is
# prose on purpose -- "built (all six leaves)", "implemented; its Python half
# deleted" -- and the table's own preamble says the column names which part is
# missing. CheckIndex compares that cell to the enum verbatim, so 23 of 114
# rows would fail on wording rather than on drift. README.md is therefore
# excluded here instead: with no index configured, spec-lint would otherwise
# try to parse the index itself as a spec.
spec:
  dir: specs
  status: [draft, designed, implemented, built, deferred, superseded]
  require: [title, status]
  exclude: [BACKLOG.md, README.md]

golangci:
  # This repository keeps its own .golangci.yml rather than the shared one, and
  # this is the record of that decision rather than an omission.
  #
  # It runs about nineteen linters against the shared seven, and what it adds
  # is not boilerplate: bodyclose and sqlclosecheck for a service with a
  # database and HTTP clients, errorlint over wrapping, nilerr, gosec with
  # G301/G306 excluded because a reproduction repository is meant to be read,
  # a revive rule set, and a fifty-word British-English spelling list that
  # argues why "artifact" alone stays American. It also exempts _test.go from
  # six linters, with the reasoning written beside the rule.
  #
  # Rendering that from a shared template would either lose it or turn this
  # file into a second golangci config. Revisit when the shared set is a
  # superset of what is here.
  own: >-
    nineteen linters, gosec and revive rule sets, and a spelling policy that
    a shared template cannot carry

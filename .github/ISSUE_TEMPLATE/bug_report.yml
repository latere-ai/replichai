name: Bug report
description: Something ReplicHAI does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/replichai/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I ran an audit of a paper with released data and the verdict marked
        the analysis component blocked, although ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The paper reference (a DOI, an arXiv ID, or a URL), the exact command
        or the steps in the app, and what it printed. Redact tokens.
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Where it ran
      options:
        - The hosted app (replichai.latere.ai)
        - CLI, anthropic-managed runtime
        - CLI, local runtime
        - CLI, memory runtime
        - My own deployment of the server
        - Not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        The release tag you installed, or the commit you built from
        (`git rev-parse --short HEAD`). For a reproduction, the build and the
        method digest in its replication.json.
      placeholder: v0.30.3
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant output, and for a local run the session directory's
        environment.json. Redact tokens and anything you would rather not
        publish.
      render: text

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The shared bar -- `go tool lateregate`, the same command as `make check`.
  # In the order it runs them: fmt-check, modernize, cgo-free, otel-client,
  # license, spec-lint, depcheck (skipped here: no package is named), lint
  # (golangci-lint against the config rendered from .lateregate.yaml), vuln,
  # test (go vet and the suite), race, hermetic, tempdir, and cover. The exact
  # plan for the current tree is `go tool lateregate list`. What stays below
  # is what that bar cannot run for us -- a suite that needs a live Postgres,
  # and a frontend that needs bun and a browser.
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  # The Postgres contracts. The shared bar runs the suite with no database, so
  # every store contract skips there; this job gives them one and runs the
  # whole suite under the race detector against it. golangci-lint is not here:
  # it is the lint gate above.
  test:
    name: test (race) + postgres contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: replichai
          POSTGRES_USER: replichai
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replichai -d replichai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A live database makes the job and access store contracts run their
      # Postgres path (SELECT ... FOR UPDATE SKIP LOCKED) instead of skipping.
      TEST_DATABASE_URL: postgres://replichai:testpass@localhost:5432/replichai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go test -race -timeout 300s ./...

  frontend:
    name: frontend (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run typecheck
      - run: cd frontend && bun run build
      - run: cd frontend && bun test src
      # The layout regression needs a real layout engine. The runner image ships
      # Chrome; naming it makes a missing browser a failure rather than a skip.
      - run: cd frontend && bun run test:browser
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

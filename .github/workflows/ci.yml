name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The Go gates that stand on their own: the ubuntu/macos matrix, gofmt,
  # go vet + go test, the hermetic run, and modernize. What stays below is
  # what this pipeline cannot delegate -- a suite that needs a live Postgres,
  # and a frontend that needs bun and a browser.
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  # golangci-lint stays here rather than in go-verify: this repo runs about
  # nineteen linters against go-verify's shared one, and the shared config
  # cannot express its reasoned test-file exclusions yet.
  test:
    name: test (race) + postgres contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: replichai
          POSTGRES_USER: replichai
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replichai -d replichai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A live database makes the job and access store contracts run their
      # Postgres path (SELECT ... FOR UPDATE SKIP LOCKED) instead of skipping.
      TEST_DATABASE_URL: postgres://replichai:testpass@localhost:5432/replichai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go test -race -timeout 300s ./...

  frontend:
    name: frontend (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run typecheck
      - run: cd frontend && bun run build
      - run: cd frontend && bun test src
      # The layout regression needs a real layout engine. The runner image ships
      # Chrome; naming it makes a missing browser a failure rather than a skip.
      - run: cd frontend && bun run test:browser
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The Go gates that stand on their own: the ubuntu/macos matrix, gofmt,
  # go vet + go test, the hermetic run, and modernize. What stays below is
  # what this pipeline cannot delegate -- a suite that needs a live Postgres,
  # and a frontend that needs bun and a browser.
  verify:
    uses: latere-ai/ci/.github/workflows/go-verify.yml@v1
    with:
      run_lint: false

  # golangci-lint stays here rather than in go-verify: this repo runs about
  # nineteen linters against go-verify's shared one, and the shared config
  # cannot express its reasoned test-file exclusions yet.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      # Built here rather than pulled as a prebuilt binary or the marketplace
      # action: golangci-lint embeds the Go toolchain it was compiled with, and
      # one built against an older Go refuses a `go 1.27` go.mod outright. This
      # compiles it with the same toolchain as the module it is linting.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run --timeout 5m ./...
      # A grep, not a linter: no analyser knows that an http.Client without an
      # instrumented Transport breaks the trace at every service boundary.
      - name: Instrumented HTTP clients
        run: make lint-otel
      # The spec tree, checked by the shared linter that already runs here.

  # Kept local: go-verify has no Postgres service, and without one every PG
  # store contract skips. This is the run that exercises them.
  test:
    name: test (race) + postgres contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: replichai
          POSTGRES_USER: replichai
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replichai -d replichai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A live database makes the job and access store contracts run their
      # Postgres path (SELECT ... FOR UPDATE SKIP LOCKED) instead of skipping.
      TEST_DATABASE_URL: postgres://replichai:testpass@localhost:5432/replichai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go test -race -timeout 300s ./...

  frontend:
    name: frontend (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run typecheck
      - run: cd frontend && bun run build
      - run: cd frontend && bun test src
      # The layout regression needs a real layout engine. The runner image ships
      # Chrome; naming it makes a missing browser a failure rather than a skip.
      - run: cd frontend && bun run test:browser
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

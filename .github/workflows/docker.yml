name: Docker

on:
  push:
    branches: [main]
    # The image ships method/ and no other spec or markdown, so a push that
    # changes only those elsewhere builds no image.
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "method/**"

# Continuous image build on main. Tag releases and the production deploy are
# handled by release.yml through the central reusable pipeline. This workflow
# only keeps a fresh ghcr image, tagged by branch and sha, available between
# releases.

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner slots are better spent on it.
# It also keeps an older run from finishing last and pushing its image
# over the newer one's branch tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The version the binary reports on every span, metric, and log
          # record. Without it the image would call itself "dev" in production.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

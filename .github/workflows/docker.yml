name: Docker

on:
  push:
    branches: [main]

# Continuous image build on main. Tag releases and the production deploy are
# handled by release.yml through the central reusable pipeline. This workflow
# only keeps a fresh ghcr image, tagged by branch and sha, available between
# releases.

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner slots are better spent on it.
# It also keeps an older run from finishing last and pushing its image
# over the newer one's branch tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-vm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The version the binary reports on every span, metric, and log
          # record. Without it the image would call itself "dev" in production.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Release

# Tag-triggered release and production deploy through the central reusable
# pipeline in latere-ai/ci. Pushing a v* tag builds the image, applies
# deploy/prod/, rolls the Deployment in the `latere` namespace, runs the smoke
# script against the live URL, and publishes the GitHub release. The deploy
# always targets prod. There is no CI staging deploy; the staging overlay is a
# prepared stub. Local development uses `docker compose` or `make up` and never
# touches this pipeline.
#
#   git tag v0.1.0 && git push origin v0.1.0   # builds and deploys to prod
#
# replichai builds from a single Dockerfile, so build_mode is dockerfile, and
# runs its own migrations at startup, so no separate build or migrate step is
# needed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  actions: read
  # The pipeline signs the image it pushes with this run's OIDC identity
  # (keyless cosign) and, in a public repository, attests the image's
  # provenance and SBOM. A called workflow cannot exceed these.
  id-token: write
  attestations: write

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/service-release.yml@v1
    with:
      service: replichai
      image: ghcr.io/latere-ai/replichai
      namespace: latere
      url: https://replichai.latere.ai
      title: Replichai
      build_mode: dockerfile
      dockerfile: Dockerfile
      has_frontend: false
    secrets: inherit

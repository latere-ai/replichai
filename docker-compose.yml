# Local end-to-end run: Postgres + the replichai server.
#
#   docker compose up --build
#
# Then submit a paper and watch the job run:
#   curl -s localhost:8080/healthz
#   curl -s -XPOST localhost:8080/papers -H 'content-type: application/json' \
#        -d '{"url":"10.1145/3544548.3580778"}'
#   curl -s localhost:8080/jobs/<job_id>
#
# It defaults to the in-process "memory" provider, so jobs run in seconds with
# no API key. Set PROVIDER=anthropic and REPLICHAI_API_KEY for real audits. The
# --dev gate (DEV=true) admits every request as a synthetic principal — local
# use only; the real access gate is 006c.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: replichai
      POSTGRES_USER: replichai
      POSTGRES_PASSWORD: replichai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replichai -d replichai"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://replichai:replichai@postgres:5432/replichai?sslmode=disable
      PROVIDER: ${PROVIDER:-memory}
      REPLICHAI_API_KEY: ${REPLICHAI_API_KEY:-}
      DEV: "true"
      # The container binds all interfaces (:8080), so the loopback-only dev
      # bypass needs this explicit override; never set it in production.
      DEV_INSECURE: "true"
      # The dev bypass authenticates as dev@local but grants nothing; seeding it
      # as a platform admin is what lets it operate locally (like a real admin).
      ADMIN_EMAILS: dev@local
      ADDR: ":8080"
      # A per-phase pause so the SSE stream shows resolving -> running ->
      # publishing -> done instead of finishing instantly. Dev only; set to 0
      # (or override) for the memory provider's true speed.
      RUNNER_DELAY: ${RUNNER_DELAY:-1500ms}
    ports:
      - "8080:8080"

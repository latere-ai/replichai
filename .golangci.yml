version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose        # an unclosed response body leaks a connection
    - errorlint        # %w and errors.Is/As used correctly across wrapping
    - copyloopvar
    - durationcheck
    - nilerr           # returning nil after a non-nil error
    - rowserrcheck
    - sqlclosecheck
    - noctx            # HTTP requests without a context cannot be cancelled
    - contextcheck
    - errchkjson

    # Security
    - gosec

    # Clarity
    - revive
    - misspell
    - unconvert
    - unparam
    - wastedassign
    - prealloc
    - godot            # comments end in a period; they are prose here
    - nolintlint       # every //nolint must be specific and explained

  settings:
    errcheck:
      # Best-effort cleanup is deliberate and documented at each call site.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        # A failed write to stdout or stderr is not actionable: there is
        # nowhere left to report it.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: var-naming
        - name: unreachable-code
    gosec:
      excludes:
        # A reproduction repository is meant to be read, committed, and
        # browsed, so 0755 directories and 0644 files are correct here;
        # G301/G306 assume a secrets-handling default that does not apply.
        - G301
        - G306
    misspell:
      # US spelling: "artifact" is the domain term used by the research
      # community, the backend API, and this project's own documents. It is
      # the only word we hold to US spelling, so the locale stays US and the
      # British forms this project writes everywhere else are listed below.
      locale: US
      # Prose here is British English on purpose. These are spellings, not
      # mistakes; `artefact` is deliberately absent so the one word that must
      # stay American keeps being enforced.
      ignore-rules:
        - analyse
        - analyses
        - authorised
        - authorises
        - behaviour
        - behavioural
        - behaviours
        - cancelled
        - cancelling
        - catalogue
        - catalogues
        - centre
        - centred
        - favour
        - favours
        - honour
        - honoured
        - honouring
        - honours
        - initialise
        - initialised
        - initialises
        - labelled
        - labelling
        - licence
        - licences
        - marshalling
        - materialise
        - materialised
        - materialises
        - organisation
        - organise
        - organised
        - organises
        - recognisable
        - recognise
        - recognised
        - recognises
        - reorganises
        - reorganising
        - serialise
        - serialised
        - serialises
        - summarise
        - summarised
        - summarises
        - summarising
        - synthesised
        - synthesises
        - travelled
        - unrecognised

  exclusions:
    rules:
      # Tests exercise error paths deliberately and read fixture files by
      # constructed path; neither is a finding there. They also marshal literals
      # they wrote a line earlier, where a checked error is noise, and build
      # small fixture slices where a preallocation says nothing.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - noctx
          - errchkjson
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/latere-ai/replichai

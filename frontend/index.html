<!doctype html>
<html lang="en" data-design="ink">
  <head>
    <!-- `data-design="ink"` above opts the page into latere-ui's ink ladder,
         the palette the platform and its identity pages read (047). -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The faces every first screen sets: Inter for what is read, Instrument
         Serif for what is stated. Without the preload a face is requested only
         when its glyphs are first laid out, which is late enough to swap the
         text under a reader already looking at it. 600 is left to load on use. -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <!-- Everything between the markers is what this document says about itself,
         and the server replaces the whole region for an address it can describe
         — a published reproduction, a researcher's page (042a). It is a region
         rather than an append because a second <title> does not reliably
         override the first, and it holds nothing else: the icon, the font
         preload and the theme script below must survive the substitution
         untouched.

         The card is absolute because a crawler resolves it against nothing, and
         it points at production from every environment on purpose: the image is
         the same picture wherever the link was copied from. -->
    <!--seo-->
    <title>ReplicHAI · Does the paper reproduce?</title>
    <meta
      name="description"
      content="ReplicHAI audits the reproducibility of research papers. It implements and re-runs the part of a paper a machine can run, does not simulate the study with human participants, and publishes a verdict with the full transcript."
    />
    <link rel="canonical" href="https://replichai.latere.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReplicHAI" />
    <meta property="og:title" content="Does the paper reproduce?" />
    <meta
      property="og:description"
      content="ReplicHAI re-runs the part of a paper a machine can run. The study with people is named, marked out of scope, and never simulated."
    />
    <meta property="og:url" content="https://replichai.latere.ai/" />
    <meta property="og:image" content="https://replichai.latere.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Does the paper reproduce?" />
    <meta
      name="twitter:description"
      content="ReplicHAI re-runs the part of a paper a machine can run. The study with people is named, marked out of scope, and never simulated."
    />
    <meta name="twitter:image" content="https://replichai.latere.ai/og.png" />
    <!--/seo-->
    <!-- The appearance, stamped before the first paint. React resolves the same
         choice, but it does so in an effect — which is one painted frame too
         late, and 040 made that frame visible: the landing's slabs used to be
         near-black in both appearances, and now a dark-mode reader would see
         them flash paper. Same three values `theme.ts` reads, deliberately
         duplicated here because nothing else can run this early. -->
    <script>
      try {
        var m = localStorage.getItem('theme')
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = m
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  <circle cx="16" cy="16" r="10.4" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.3" stroke-dasharray="6.75 4.14" />
  <circle cx="16" cy="16" r="5.6" fill="none" stroke="#ffffff" stroke-width="3.1" />
</svg>
